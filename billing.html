<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack AI - Billing</title>

    <!-- html5-qrcode Library Import -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        @media print {
            body * {
                visibility: hidden;
            }

            #billArea,
            #billArea * {
                visibility: visible;
            }

            #billArea {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }

            /* Hide Action Buttons inside Print Output */
            button, .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <h1>MediTrack AI - Billing</h1>

    <hr>

    <h3>Customer Details</h3>

    <!-- Customer Details Inputs (Matching js/billing.js) -->
    <input
        type="text"
        id="customerName"
        placeholder="Customer Name"
        required>

    <input
        type="tel"
        id="customerPhone"
        placeholder="Mobile Number"
        maxlength="10"
        required>

    <br><br>

    <hr>

    <h3>Medicine Billing</h3>

    <select id="medicineSelect">
        <option value="">Select Medicine</option>
    </select>

    <!-- Barcode Scan Button -->
    <button id="startScanBtn" style="background-color: #28a745; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">
        📷 Scan Barcode
    </button>

    <input
        type="number"
        id="qty"
        placeholder="Quantity"
        min="1">

    <button id="addBillItem" style="padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">
        Add To Bill
    </button>

    <!-- Updated Camera Video Stream Modal with Zoom Controls -->
    <div id="scannerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;">
      <div style="background: white; padding: 20px; border-radius: 10px; width: 320px; text-align: center;">
        <h3 style="margin-top: 0;">Scan Medicine Barcode</h3>
        <div id="reader" style="width: 100%; overflow: hidden; border-radius: 8px;"></div>
        
        <!-- Zoom Buttons -->
        <div style="margin-top: 12px; display: flex; gap: 10px; justify-content: center;">
          <button type="button" id="zoom1xBtn" style="background: #007bff; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">1x</button>
          <button type="button" id="zoom2xBtn" style="background: #17a2b8; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">2x Zoom</button>
        </div>

        <button type="button" id="closeScanBtn" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; margin-top: 12px; border-radius: 6px; cursor: pointer;">
          Close Camera
        </button>
      </div>
    </div>

    <hr>

    <div id="billArea">

        <h1 style="text-align:center;">MediTrack AI</h1>

        <h3 style="text-align:center;">
            Medical Store Management System
        </h3>

        <hr>

        <h3>Customer Bill</h3>

        <p><strong>Invoice No :</strong>
        <span id="invoiceNo"></span></p>

        <p><strong>Date :</strong>
        <span id="billDate"></span></p>

        <p><strong>Time :</strong>
        <span id="billTime"></span></p>

        <p><strong>Customer :</strong>
        <span id="billCustomer">-</span></p>

        <p><strong>Mobile :</strong>
        <span id="billPhone">-</span></p>

        <table border="1" cellpadding="10" cellspacing="0" style="width:100%; border-collapse:collapse; text-align:left;">

            <thead>
                <tr style="background:#f4f4f4;">
                    <th>Medicine</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="billTable"></tbody>

        </table>

        <br>

        <h2 id="grandTotal">
            Grand Total: ₹0.00
        </h2>

        <hr>

        <p style="text-align:center;">
            Thank You for Visiting!
        </p>

        <p style="text-align:center;">
            Get Well Soon 😊
        </p>

    </div>

    <div style="margin-top: 20px;">
        <button id="generateBill" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;">
            Generate Bill
        </button>

        <button id="printBill" style="padding: 10px 20px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-left: 10px;">
            Print Bill
        </button>
    </div>

    <!-- Script version updated to v=888 -->
    <script type="module" src="js/billing.js?v=888"></script>

</body>
</html>
