<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack-AI | Customers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>💊 MediTrack-AI</h2>
        <ul>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="medicines.html">💊 Medicines</a></li>
            <li><a href="billing.html">💰 Billing</a></li>
            <li><a href="customers.html" class="active">👥 Customers</a></li>
            <li><a href="reports.html">📊 Reports</a></li>
            <li><a href="settings.html">⚙ Settings</a></li>
            <li><a href="#" id="logoutBtn">🚪 Logout</a></li>
        </ul>
    </aside>

    <main class="content">
        <!-- Top Header (Cleaned) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0;">Customers 👥</h1>
        </div>

        <!-- Search & Sort Controls -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <input type="text" id="searchCustomerInput" placeholder="Search by Name or Mobile" style="padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 6px;">

            <select id="sortCustomersSelect" style="padding: 10px; border: 1px solid #007bff; border-radius: 6px; background-color: #f8f9fa; cursor: pointer; font-weight: 500;">
                <option value="recent">📅 Sort: Recent Purchase</option>
                <option value="name">🔤 Sort: Name (A-Z)</option>
                <option value="purchaseHigh">💰 Sort: High Purchase</option>
                <option value="purchaseLow">💵 Sort: Low Purchase</option>
            </select>
        </div>

        <table class="medicine-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Total Bills</th>
                    <th>Total Purchase</th>
                    <th>Last Purchase</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="customersTableBody">
                <tr><td colspan="6" style="text-align: center; padding: 20px;">Loading Customers Data...</td></tr>
            </tbody>
        </table>

    </main>

</div>

<script type="module" src="js/customers.js?v=2"></script>

</body>
</html>
