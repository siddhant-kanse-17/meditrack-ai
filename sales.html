<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Auth verification hone tak page ko render nahi hone dena
    document.documentElement.style.display = 'none';
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediTrack-AI | Sales History</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Clean layout styling */
    .sales-container { padding: 20px; }
    .sales-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .sales-table th, .sales-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .sales-table th { background-color: #007bff; color: white; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: white; padding: 25px; border-radius: 10px; width: 400px; max-width: 90%; }
  </style>
</head>
<body>
  <div class="app-container" style="display: flex;">
    
    <!-- Unified Sidebar Layout -->
    <aside class="sidebar">
      <div class="logo">
        <h2>💊 MediTrack-AI</h2>
      </div>
      <hr style="opacity: 0.3; margin-bottom: 20px;">
      <ul class="nav-links" style="list-style: none; padding: 0;">
        <li style="margin-bottom: 15px;"><a href="dashboard.html" style="color: white; text-decoration: none;">🏠 Dashboard</a></li>
        <li style="margin-bottom: 15px;"><a href="medicines.html" style="color: white; text-decoration: none;">💊 Medicines</a></li>
        <li style="margin-bottom: 15px;"><a href="billing.html" style="color: white; text-decoration: none;">💰 Billing</a></li>
        <li style="margin-bottom: 15px;"><a href="customers.html" style="color: white; text-decoration: none;">👥 Customers</a></li>
        <li style="margin-bottom: 15px;"><a href="reports.html" style="color: white; text-decoration: none;">📊 Reports</a></li>
        <li style="margin-bottom: 15px;"><a href="settings.html" style="color: white; text-decoration: none;">⚙️ Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content" style="flex: 1; padding: 25px;">
      <h2>Sales History 📊</h2>

      <!-- Search Input -->
      <div style="margin-bottom: 20px;">
        <input type="text" id="searchSales" placeholder="Search by Invoice, Name or Mobile..." style="padding: 10px; width: 320px; border: 1px solid #ccc; border-radius: 6px;">
      </div>

      <table class="sales-table">
        <thead>
          <tr>
            <th>Invoice / ID</th>
            <th>Customer</th>
            <th>Mobile</th>
            <th>Total Amount</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="salesTableBody">
          <tr><td colspan="6" style="text-align:center;">Loading sales records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="invoiceModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- IMPORTANT: JavaScript Module Tag -->
  <script type="module" src="js/sales.js"></script>
</body>
</html>
