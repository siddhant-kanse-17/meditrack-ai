<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack-AI | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>💊 MediTrack-AI</h1>
    <p>Medical Store Management System</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

        <p id="error" style="color: #dc3545; margin-top: 10px; font-size: 14px;"></p>

    </form>

</div>

<!-- Updated cache-busting script tag -->
<script type="module" src="js/login.js?v=300"></script>

</body>
</html>
