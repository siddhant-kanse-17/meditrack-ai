<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack-AI | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>💊 MediTrack-AI</h1>
    <p style="color: #333; font-size: 14px; font-weight: 600; margin-bottom: 4px;">Medical Store Management System</p>
    <p style="color: #495057; font-size: 13px; font-weight: 600; margin-top: 0; margin-bottom: 20px;">Registered Email Only</p>

    <!-- novalidate added to prevent mobile native browser interference -->
    <form id="loginForm" novalidate>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email"
            autocomplete="email"
            required
        >

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

        <p id="error" style="color: #dc3545; margin-top: 10px; font-size: 14px; display: none;"></p>

    </form>

</div>

<!-- Updated script path to auth.js -->
<script type="module" src="js/auth.js?v=999"></script>

</body>
</html>
